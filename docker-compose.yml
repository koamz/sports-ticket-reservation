services:
  postgres_db:
    image: postgres:15-alpine
    container_name: sports_ticket_postgres
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: sports_ticket_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_production:/var/lib/postgresql/data
      - ./database/migrations/01_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
      - ./database/seeds/02_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql
      - ./database/procedures/stored_procedures.sql:/docker-entrypoint-initdb.d/03_stored_procedures.sql 
    restart: always

  redis_cache:
    image: redis:7-alpine
    container_name: sports_ticket_redis
    ports:
      - "6379:6379"
    restart: always

  elasticsearch:
    image: elasticsearch:8.11.1
    container_name: sports_ticket_elasticsearch
    hostname: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    restart: always

  backend_app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sports_ticket_backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://test_user:test_password@postgres_db:5432/sports_ticket_db
      REDIS_URL: redis://redis_cache:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      PORT: 3000
      JWT_SECRET: super_secret_key_for_jwt_tokens
    depends_on:
      - postgres_db
      - redis_cache
      - elasticsearch
    restart: always

  db_viewer:
    image: adminer
    container_name: sports_ticket_db_viewer
    ports:
      - "8080:8080"
    depends_on:
      - postgres_db
    restart: always

volumes:
  pgdata_production: